# Статическая раздача плеера. Никакого другого сервера нет.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Уроки правятся на диске, поэтому браузер не должен их кэшировать.
    add_header Cache-Control "no-store";

    location / {
        try_files $uri $uri/ =404;
    }
}
